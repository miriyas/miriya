name: 프로덕션 배포

on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/miriyas/miriya

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    # A newer push cancels an older build: the newer commit contains all earlier changes.
    concurrency:
      group: build-prod
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Build on the runner, not inside Docker: node_modules and .next/cache are kept
      # between runs, so a normal deploy does not install packages or compile from zero.
      # Keep the Node version the same as Dockerfile.prebuilt (sharp is a native module).
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node18.20.8-${{ hashFiles('yarn.lock') }}

      - name: Install packages
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      # NEXT_PUBLIC_* and GITHUB_ACCESS_TOKEN (static /minihome/home) are needed at build time.
      # Lint already runs in the pre-commit hook, so it is skipped here.
      - name: Build
        env:
          BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          trap 'rm -f .env.production' EXIT
          (umask 077; printf '%s\n' "$BUILD_ENV" > .env.production)
          yarn build --no-lint

      # IMPORTANT: standalone output COPIES .env* files into .next/standalone.
      # Remove them, then make sure no secret value is left in the image context.
      - name: Make image context
        env:
          BUILD_ENV: ${{ secrets.FRONTEND_BUILD_ENV }}
        run: |
          ctx="$RUNNER_TEMP/image"
          rm -f .next/standalone/.env*
          mkdir -p "$ctx/.next"
          cp -a .next/standalone/. "$ctx/"
          cp -a .next/static "$ctx/.next/static"
          cp -a public "$ctx/public"
          if find "$ctx" -maxdepth 1 -name '.env*' | grep -q .; then
            echo "env file left in image context" >&2; exit 1
          fi
          token="$(printf '%s\n' "$BUILD_ENV" | sed -n 's/^GITHUB_ACCESS_TOKEN=//p')"
          if [ -n "$token" ] && grep -rqF -- "$token" "$ctx"; then
            echo "GITHUB_ACCESS_TOKEN found in image context" >&2; exit 1
          fi
          du -sh "$ctx"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/image
          file: Dockerfile.prebuilt
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # A deploy that has started always runs to the end (never cancelled half-way).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          # Short-lived token for pulling the image. deploy.sh reads it from stdin.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes "deploy@$HOST" "frontend sha-${GITHUB_SHA}"
